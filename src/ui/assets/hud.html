<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="CSP_PLACEHOLDER" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style nonce="NONCE_PLACEHOLDER">STYLE_PLACEHOLDER</style>
<title>Veto HUD</title>
</head>
<body>
<header id="hdr">
  <span class="logo">⬡ VETO</span>
  <span id="verdict" class="badge">—</span>
  <span id="stale" class="stale" hidden>⟳</span>
</header>
<div id="notInstalled" class="empty" hidden>
  Veto database unavailable. Check the configured database path and extension host runtime.
  <div class="actions"><button class="btn" data-cmd="veto.openInstallDocs">Install docs</button></div>
</div>
<main id="cards"></main>
<nav class="actions" aria-label="Browse Veto records and workflows">
  <button class="btn sec" data-cmd="veto.backendVisibility">Load lessons / trial</button>
  <button class="btn sec" data-cmd="veto.searchTranscripts">Search transcripts</button>
  <button class="btn sec" data-cmd="veto.backendDiagnostics">Backend setup</button>
  <button class="btn sec" data-cmd="veto.selectProject">Select project</button>
  <button class="btn sec" data-cmd="veto.browseSessions">Sessions</button>
  <button class="btn sec" data-cmd="veto.browseMemory">Memory details</button>
  <button class="btn sec" data-cmd="veto.councilHistory">Council history</button>
  <button class="btn sec" data-cmd="veto.reviewDetails">Review results</button>
  <button class="btn sec" data-cmd="veto.decisionHistory">Decisions</button>
  <button class="btn sec" data-cmd="veto.decisionConstraints">Constraints</button>
  <button class="btn sec" data-cmd="veto.learningDetails">Learning</button>
  <button class="btn sec" data-cmd="veto.browseTools">Tools</button>
  <button class="btn sec" data-cmd="veto.browseAgents">Specialists</button>
  <button class="btn sec" data-cmd="veto.draftCommitMessage">Draft commit</button>
  <button class="btn sec" data-cmd="veto.draftPrDescription">Draft PR</button>
</nav>
<script nonce="NONCE_PLACEHOLDER">SCRIPT_PLACEHOLDER</script>
</body>
</html>
